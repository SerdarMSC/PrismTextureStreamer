name: Build DLL (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, Win32]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild (add msbuild to PATH)
        uses: microsoft/setup-msbuild@v1

      - name: Show environment info
        shell: cmd
        run: |
          echo Configuration=${{ matrix.configuration }} Platform=${{ matrix.platform }}
          echo WORKING DIR: %CD%
          where msbuild || echo "msbuild not found"
          msbuild /version || echo "msbuild /version failed"
          echo ==== dir listing repo root ====
          dir /b

      - name: Detect installed Windows SDK and export to GITHUB_ENV
        shell: powershell
        run: |
          $path = 'C:\Program Files (x86)\Windows Kits\10\Include'
          if (Test-Path $path) {
            $sdks = Get-ChildItem $path -Directory | Select-Object -ExpandProperty Name | Sort-Object -Descending
            if ($sdks.Count -gt 0) {
              Write-Output "Found SDKs: $sdks"
              $selected = $sdks[0]
              Write-Output "Using SDK: $selected"
              Add-Content -Path $env:GITHUB_ENV -Value "WINSDK=$selected"
            } else {
              Write-Output "No Windows 10 SDKs found under $path"
              exit 1
            }
          } else {
            Write-Output "$path not found on runner"
            exit 1
          }

      - name: Restore NuGet packages (if any)
        shell: cmd
        run: |
          nuget restore PrismTextureStreamerFB.sln || dotnet restore PrismTextureStreamerFB.sln || echo "nuget/dotnet restore returned non-zero"

      - name: Build solution with MSBuild (diagnostic + fixed OutDir + SDK override)
        shell: cmd
        run: |
          echo Using Windows SDK: %WINSDK%
          if "%WINSDK%"=="" (
            echo WINSDK not set, continuing without overriding WindowsTargetPlatformVersion
            msbuild PrismTextureStreamerFB.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:OutDir=%CD%\artifacts\ /verbosity:diagnostic /m
          ) else (
            echo Overriding WindowsTargetPlatformVersion to %WINSDK%
            msbuild PrismTextureStreamerFB.sln /p:WindowsTargetPlatformVersion=%WINSDK% /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:OutDir=%CD%\artifacts\ /verbosity:diagnostic /m
          )
          if %ERRORLEVEL% neq 0 (
            echo MSBuild failed with %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )

      - name: Show artifacts dir
        shell: cmd
        run: |
          echo ==== artifacts content ====
          if exist artifacts (
            dir artifacts /s /b
          ) else (
            echo "artifacts folder not found"
          )

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismtexturestreamer-dlls
          path: artifacts/**/*.dll
