name: Build DLL (Windows x64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # windows-latest de calisir; VS2022 (v143 toolset) icin 2022 daha garantili
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        # Proje SADECE x64'te DynamicLibrary. Win32 konfigurasyonlari EXE ve
        # include/lib yollari tanimsiz -> derlenmez. Bu yuzden x64 sabit.
        configuration: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Runner uzerindeki en yeni Windows SDK'yi bul
        shell: pwsh
        run: |
          $inc = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdks = Get-ChildItem $inc -Directory |
                  Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]$_.Name }
          if (-not $sdks) { throw "Windows 10 SDK bulunamadi: $inc" }
          Write-Host "Bulunan SDK'lar:"
          $sdks | ForEach-Object { Write-Host "  $($_.Name)" }
          $latest = $sdks[-1].Name
          Write-Host "Kullanilacak: $latest"
          "WINSDK=$latest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ortam bilgisi
        shell: pwsh
        run: |
          msbuild -version
          Write-Host "Lib klasoru:"
          Get-ChildItem Lib

      - name: Build (x64)
        shell: pwsh
        run: |
          msbuild PrismTextureStreamerFB.sln `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$env:WINSDK `
            /p:PostBuildEventUseInBuild=false `
            /p:OutDir="$pwd\artifacts\" `
            /p:GenerateDebugInformation=true `
            /v:normal `
            /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cikti kontrolu
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Recurse | Select-Object FullName, Length
          if (-not (Test-Path "artifacts\PrismTextureStreamerFB.dll")) {
            throw "DLL uretilmedi!"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrismTextureStreamerFB-${{ matrix.configuration }}-x64
          path: |
            artifacts/*.dll
            artifacts/*.pdb
          if-no-files-found: error
