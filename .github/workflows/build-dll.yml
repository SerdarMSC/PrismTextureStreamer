name: Build DLL (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild (add msbuild to PATH)
        uses: microsoft/setup-msbuild@v1

      - name: Show environment info
        shell: cmd
        run: |
          echo Configuration=${{ matrix.configuration }} Platform=${{ matrix.platform }}
          echo WORKING DIR: %CD%
          where msbuild || echo "msbuild not found"
          msbuild /version || echo "msbuild /version failed"
          echo ==== dir listing repo root ====
          dir /b

      - name: Skip NuGet restore for native C++ projects
        shell: cmd
        run: |
          echo "No NuGet restore needed for native C++ projects"

      - name: Build solution with MSBuild (map Win32 -> x86)
        shell: cmd
        run: |
          set "MATRIX_PLATFORM=${{ matrix.platform }}"
          if "%MATRIX_PLATFORM%"=="Win32" (
            set "SOL_PLATFORM=x86"
          ) else (
            set "SOL_PLATFORM=%MATRIX_PLATFORM%"
          )
          echo Building with Configuration=${{ matrix.configuration }} MatrixPlatform=%MATRIX_PLATFORM% SolutionPlatform=%SOL_PLATFORM%
          msbuild PrismTextureStreamerFB.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=%SOL_PLATFORM% /p:OutDir=%CD%\artifacts\ /verbosity:normal /m
          if %ERRORLEVEL% neq 0 (
            echo MSBuild failed with %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )

      - name: Show artifacts dir
        shell: cmd
        run: |
          echo ==== artifacts content ====
          if exist artifacts (
            dir artifacts /s /b
          ) else (
            echo "artifacts folder not found"
          )

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismtexturestreamer-dlls
          path: artifacts/**/*.dll
